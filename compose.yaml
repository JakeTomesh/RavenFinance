
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ravenfinance:dev
    ports:
      - "8080:8080"
    env_file:
      - ravenfinance.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ravenfinance-network
    


  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - ravenfinance-sql-data:/var/opt/mssql
    networks:
      - ravenfinance-network
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


      
volumes:
  ravenfinance-sql-data:
    external: true



networks:
  ravenfinance-network:
    external: true
